name: Bonfire Interactive
description: >-
  Bonfire Interactive is a strategic sourcing and procurement software company
  serving the public sector, based in the Kitchener-Waterloo region of Ontario,
  Canada. Its GoBonfire platform digitizes RFP/RFQ sourcing, bid evaluation and
  scoring, supplier management, and contract workflows for government agencies,
  education, healthcare, utilities, and nonprofit organizations. Bonfire was
  acquired by GTY Technology Holdings in 2019, and has since been consolidated —
  alongside IonWave, EqualLevel, and DemandStar — into Euna Solutions as Euna
  Procurement, a full-cycle public-sector procurement suite spanning sourcing,
  contracting, marketplace purchasing, invoicing, and supplier management. The
  gobonfire.com domain now redirects to eunasolutions.com. Bonfire does not
  publish a public developer API program or OpenAPI definition; this profile is
  maintained for API Evangelist network completeness and demand tracking.
